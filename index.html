<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Data Collection</title>

  <style>
    /* --- Global Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a2540, #1769aa, #1f8ef1);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .form-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 2rem 3rem;
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      color: white;
      width: 350px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .form-container:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 1.2rem;
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      color: #f0f0f0;
    }

    input, select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.85);
      transition: box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.8rem;
      background: #00b4d8;
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: #0077b6;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Real Estate Interest Form</h2>
    <form id="realEstateForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="18" max="100" required>
      </div>

      <div class="form-group">
        <label for="interest">Interested In</label>
        <select id="interest" name="interest" required>
          <option value="">-- Select --</option>
          <option value="Residential">Residential Property</option>
          <option value="Commercial">Commercial Property</option>
          <option value="Plot">Land / Plot</option>
          <option value="Investment">Investment Opportunity</option>
        </select>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div class="note">Our team will contact you shortly after submission.</div>
  </div>

  <script>
    // Simple form submission alert (for now)
    document.getElementById("realEstateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Thank you! Your information has been submitted successfully.");
      this.reset();
    });
  </script>
</body>
</html>
